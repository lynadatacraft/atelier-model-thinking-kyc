[project]
name = "datacraft"
version = "0.1.0"
description = "DATACRAFT reference solution: justified, deterministic-first questionnaire answering"
readme = "README.md"
authors = [
    { name = "lyna", email = "lyna.ouachek@datacraft.paris" }
]
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "rapidocr>=3.9.2",
]

[project.scripts]
datacraft = "datacraft:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
